.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#18354A99,transparent 55%)}
.hero h1{font-size:52px;position:relative;color:#fff}
.hero p{position:relative;font-size:15px;color:#fff}
.season-card{margin:-40px 20px 0;background:var(--card);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px #0002;position:relative;cursor:pointer;border:0;width:calc(100% - 40px);text-align:left;color:var(--ink);font-family:inherit}
.season-card small{color:var(--mute);font-size:14px;display:block}
.season-card b{font-size:26px}
.season-card .ch{margin-left:auto}
h2{font-size:24px;margin:26px 20px 14px}
.ring{display:flex;align-items:center;gap:20px;padding:0 20px 20px}
.ring .c{position:relative;width:118px;height:118px;flex:none}
.ring .c div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.ring .c b{font-size:19px}
.ring q{color:var(--mute);font-size:15px;quotes:none}
.sc{height:182px;border-radius:20px;margin-bottom:18px;position:relative;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit;overflow:hidden}
.sc h3{font-size:30px}.sc p{font-size:14px;max-width:62%;opacity:.95}
.sc .go{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:#F7F5EF;color:#18354A;display:flex;align-items:center;justify-content:center}
.sc:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0006,transparent 60%);pointer-events:none}
.sc>*{z-index:1}
.t-head{display:flex;gap:14px;align-items:center;margin:10px 0 18px}
.t-head .bar{height:8px;background:var(--track);border-radius:8px;margin-top:8px;overflow:hidden}
.t-head .bar i{display:block;height:100%;background:var(--mute);border-radius:8px;transition:width .3s}
.tabs{display:flex;background:var(--out);border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:9px 2px;border-radius:7px;font:500 14px 'DM Sans',sans-serif;color:var(--ink);cursor:pointer}
.tabs button.on{background:#D9C9AE99;color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px #B58B5780}
.tabs button{transition:background .2s,color .2s}
.task{background:var(--card);border-radius:10px;padding:0 12px;height:48px;display:flex;align-items:center;gap:12px;margin-bottom:9px;font-size:14.5px;position:relative}
.task .cb{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--mute);background:none;flex:none;cursor:pointer;color:#fff;padding:0;display:flex;align-items:center;justify-content:center}
.task.done .cb{background:var(--mute);border-color:var(--mute)}
.task.done .tt{text-decoration:line-through;opacity:.55}
.task .ic{flex:none;display:flex}
.task .tt{flex:1}
.chip{background:var(--chip);color:var(--acc);font-size:12px;padding:5px 11px;border-radius:12px}
.play{width:26px;height:26px;border-radius:50%;background:var(--acc);border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.play svg{width:12px;height:12px;fill:#fff;stroke:none}
.menu{position:absolute;right:8px;top:42px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px #0003;z-index:5;overflow:hidden}
.menu button{display:block;width:150px;text-align:left;padding:11px 14px;border:0;background:none;font:14px 'DM Sans';color:var(--ink);cursor:pointer}
label{display:block;font-size:14px;margin:16px 0 7px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font:14px 'DM Sans',sans-serif;color:var(--ink)}
textarea{height:96px;resize:none}
.seas{display:flex;gap:10px}
.seas button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 0 10px;font:14px 'DM Sans';color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.seas button.on{border:2px solid var(--ink)}
.seas svg{width:30px;height:30px}
.cta{width:100%;margin-top:22px;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:16px;font:700 16px 'DM Sans';cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.more p{background:var(--card);border-radius:10px;padding:14px;margin-bottom:9px;font-size:15px}
#ov{position:absolute;inset:0;background:#0a1924a6;display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .25s}
#ov[hidden]{display:none}
.dn{width:min(84%,320px);border-radius:28px;background:radial-gradient(120% 70% at 50% 0%,#5d7f93 0%,#2f5870 45%,#18354A 100%);color:#fff;text-align:center;padding:20px 22px 24px;position:relative;box-shadow:0 20px 50px #0007;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.dn .x{position:absolute;right:14px;top:14px;color:#fff;background:none;border:0;cursor:pointer;padding:4px}
.dn .bell{width:170px;height:190px;margin:14px auto 6px;display:block;transform-origin:50% 0;animation:swing 1.6s ease-in-out .3s 2}
.dn h3{font-size:30px;margin-bottom:8px}
.dn p{font-size:14.5px;line-height:1.4;margin:0 4px 10px}
.dn .wv{width:34px;height:20px;color:#fff;opacity:.9}
.dn .cta{background:#F7F5EF;color:#18354A;margin-top:14px}
@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(7deg)}75%{transform:rotate(-7deg)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

  <button class="season-card" onclick="go('seasons')"><span style="color:${SE[S.cur].col}">${ic(SE[S.cur].ic,40)}</span><span><small>Aktuell säsong</small><b class="serif">${SE[S.cur].n}</b></span><span class="ch">${ic('chev',20)}</span></button>
  <h2 class="serif">Dina uppgifter</h2><div class="ring"><div class="c"><svg viewBox="0 0 118 118" style="width:118px;height:118px;transform:rotate(-90deg)"><circle cx="59" cy="59" r="52" stroke="var(--track)" stroke-width="9"/><circle cx="59" cy="59" r="52" stroke="var(--ink)" stroke-width="9" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:.4s"/></svg><div><b>${d} av ${n}</b>klara</div></div>
  <div><q>${d===n&&n?'“Redo för säsongen!”':'“Ett steg närmare sjösättning!”'}</q><svg class="wave" viewBox="0 0 46 24"><path d="M2 5c4-5 6 5 10 0s6 5 10 0 6 5 10 0 6 5 10 0M2 12c4-5 6 5 10 0s6 5 10 0 6 5 10 0 6 5 10 0M2 19c4-5 6 5 10 0s6 5 10 0 6 5 10 0 6 5 10 0"/></svg></div></div>`}
 else if(V==='seasons'){h=`<div style="display:flex;align-items:center;margin:32px 0 20px"><button class="ico-btn" onclick="go('home')">${ic('back')}</button><h1 class="serif" style="flex:1;text-align:center;font-size:28px;margin-right:32px">Välj säsong</h1></div>`+
  Object.keys(SE).map(k=>`<button class="sc" style="background:${SE[k].g}" onclick="S.cur='${k}';save();go('tasks','${k}')"><h3 class="serif">${SE[k].n}</h3><p>${SE[k].d}</p><span class="go">${ic('chev',22)}</span></button>`).join('')}
 else if(V==='tasks'){const[d,n]=prog(vs),all=list(vs),fl=all.filter(t=>F==='all'||t.st===F);
  h=`<button class="ico-btn" style="display:block;margin-top:34px" onclick="go('seasons')">${ic('back')}</button>
  <div class="t-head"><span style="color:${SE[vs].col}">${ic(SE[vs].ic,76)}</span><div style="flex:1"><h1 class="serif" style="font-size:34px;line-height:1">${SE[vs].n}</h1><div style="margin-top:6px;font-size:15px">${d} av ${n} klara</div><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div></div></div>
  <div class="tabs">${[['all','Alla'],['n','Ej påbörjade'],['s','Påbörjade'],['d','Klara']].map(x=>`<button class="${F===x[0]?'on':''}" onclick="F='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`+
  (fl.length?fl.map(t=>`<div class="task ${t.st==='d'?'done':t.st==='s'?'started':''}"><button class="cb" aria-label="Klar" onclick="tog(${t.id})">${t.st==='d'?ic('tick',14):''}</button><span class="ic">${ic(IC[t.cat]||'check')}</span><span class="tt">${esc(t.title)}</span>
   ${t.st==='s'?`<span class="chip">Påbörjad</span>`:''}<button class="ico-btn" aria-label="Meny" onclick="toggleMenu(${t.id})">${ic('dots')}</button>
   ${open===t.id?`<div class="menu">${t.st==='n'?`<button onclick="setst(${t.id},'s')">Markera påbörjad</button>`:''}${t.st==='s'?`<button onclick="setst(${t.id},'n')">Sätt som ej påbörjad</button>`:''}<button onclick="editTask(${t.id})">Ändra uppgift</button><button onclick="del(${t.id})">Ta bort</button></div>`:''}</div>`).join(''):`<div class="empty">Inga uppgifter här än.</div>`)}
 else if(V==='new'){h=`<button class="ico-btn" onclick="go('tasks')">${ic('close',22)}</button><h1 class="serif" style="font-size:36px;margin:14px 0 4px">${editId?'Ändra uppgift':'Ny uppgift'}</h1>
  <label>Titel</label><input id="ft" placeholder="T.ex. Byt olja i motorn" value="${esc(form.title||'')}">
  <label>Beskrivning (valfritt)</label><textarea id="fd" placeholder="Lägg till mer information...">${esc(form.desc||'')}</textarea>
  <label>Välj säsong</label><div class="seas">${Object.keys(SE).map(k=>`<button class="${form.season===k?'on':''}" onclick="setSeason('${k}')"><span style="color:${SE[k].col}">${ic(SE[k].ic)}</span>${SE[k].n}</button>`).join('')}</div>
  <label>Kategori (valfritt)</label><select id="fc" onchange="setCat(this.value)">${CATS.map(c=>`<option ${form.cat===c?'selected':''}>${c}</option>`).join('')}</select>
  <label>Påminnelse (valfritt)</label><input id="fr" type="date" value="${form.rem||''}">
  <button class="cta" onclick="add()">${editId?'Spara ändringar':'Skapa uppgift'} →</button>`}
 else{h=`<h1 class="serif" style="font-size:32px;margin:42px 0 20px">Mer</h1><div class="more"><p>⚓ DÄCK – Allt för en enklare båtsäsong.</p><p onclick="resetApp()" style="cursor:pointer">${RS?'Tryck igen för att bekräfta – allt återställs':'Återställ exempeluppgifter'}</p></div>`}
 m.innerHTML=h;
 const nv=(v,i,l)=>`<button class="${V===v?'on':''}" onclick="go('${v}'${v==='tasks'?`,S.cur`:''})">${ic(i)}${l}</button>`;
 $('nav').innerHTML=nv('home','home','Hem')+nv('tasks','check','Uppgifter')+`<button class="plus" aria-label="Ny uppgift" onclick="go('new')">${ic('plus',26)}</button>`+nv('seasons','sun','Säsong')+nv('more','menu','Mer');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const find=id=>S.tasks.find(t=>t.id===id);
function tog(id){const t=find(id);t.st=t.st==='d'?'n':'d';save();render();if(t.st==='d')showDone(t.season)}
function showDone(s){const[d,n]=prog(s);$('dmsg').textContent=d===n?'“Alla uppgifter klara – redo för säsongen!”':'“Bra jobbat! Ett steg närmare båtsäsongen.”';$('ov').hidden=false}
function closeDone(){$('ov').hidden=true}
function toggleMenu(id){open=open===id?null:id;render()}
function editTask(id){const t=find(id);form={title:t.title,desc:t.desc,season:t.season,cat:t.cat,rem:t.rem};editId=id;V='new';open=null;render()}
let RS=false;
function resetApp(){if(!RS){RS=true;render();setTimeout(()=>{RS=false;if(V==='more')render()},4000);return}
 RS=false;S={cur:'var',tasks:seed.map((t,i)=>({id:i+1,title:t[0],desc:'',season:t[1],cat:t[2],rem:'',st:t[3]}))};save();vs='var';F='all';go('home')}
function setst(id,s){find(id).st=s;open=null;save();render()}
function del(id){S.tasks=S.tasks.filter(t=>t.id!==id);open=null;save();render()}
function setSeason(k){keep();form.season=k;render()}
function setCat(v){form.cat=v}
function keep(){form.title=$('ft').value;form.desc=$('fd').value;form.rem=$('fr').value}
function add(){keep();if(!form.title.trim()){$('ft').focus();return}
 if(editId){const t=find(editId);Object.assign(t,{title:form.title.trim(),desc:form.desc,season:form.season,cat:form.cat,rem:form.rem})}else S.tasks.push({id:Date.now(),title:form.title.trim(),desc:form.desc,season:form.season,cat:form.cat,rem:form.rem,st:'n'});editId=null;save();F='all';go('tasks',form.season)}
render();
</script></body></html>
