function nav(){return `<nav aria-label="Huvudmeny"><div>${[['home','Hem'],['cam','Kamera'],['arch','Arkiv'],['more','Mer']].map(([k,l])=>`<button data-go="${k}" ${tab==k?'aria-current="page"':''}>${l}</button>`).join('')}</div></nav>`}
function back(to,l){return `<button data-go="${to}" style="width:auto;border:0;min-height:44px;padding:0">← ${l}</button>`}
function shutter(t){return `<button class="pri" data-shot ${left()?'':'disabled'}>${t}</button>`}
function oldView(){
 const r=S.roll;
 if(v=='home')return `<div class="brand">FRAME 36.</div><div class="mono">Digital film journal</div>
 <h1 style="margin-top:28px">Every frame tells a story.</h1><p>Slow down. Capture what matters.</p>
 <div class="film"><span class="mono" style="color:#fff">Roll ${pad(r.n)} · ${r.style}</span><div class="sg" style="font-size:40px;margin:14px 0 8px">${r.shots.length}<span style="font-size:18px"> / 36</span></div><div class="bar" role="progressbar" aria-label="Exponeringar" aria-valuenow="${r.shots.length}" aria-valuemin="0" aria-valuemax="36"><i style="width:${r.shots.length/36*100}%"></i></div></div>
 ${shutter('Ta ett foto')}<button data-go="roll" style="margin-top:10px">Visa pågående rulle</button>`;
 if(v=='cam')return `<h2 style="font-size:28px">Kamera</h2><p class="mono">${left()} exponeringar kvar</p>
 <div class="chips" role="group" aria-label="Filmstil">${ST.map(s=>`<button data-st="${s}" aria-pressed="${r.style==s}">${s}</button>`).join('')}</div>
 <div class="film" style="text-align:center;padding:48px 14px"><div class="sg" style="font-size:44px">${left()}</div><div class="mono" style="color:#ddd">Bilderna visas först när rullen framkallas</div></div>${shutter('Fota')}`;
 if(v=='roll')return `${back('home','Hem')}<span class="mono" style="display:block">Roll ${pad(r.n)}</span><h2 style="font-size:30px">Pågående rulle</h2>
 <div class="grid" role="list">${Array.from({length:36},(_,i)=>`<div role="listitem" class="cell ${i<r.shots.length?'on':''}" aria-label="Bild ${i+1} ${i<r.shots.length?'tagen':'tom'}">${i+1}</div>`).join('')}</div>
 ${shutter('Fortsätt foto')}<button class="pri" data-go="confirm" style="margin-top:10px" ${r.shots.length?'':'disabled'}>Framkalla rullen</button>`;
 if(v=='confirm')return `<main></main><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="t"><div><h2 id="t">Framkalla rullen?</h2><p>Rullen utvärderas och kan inte fotograferas vidare. Dina bilder framkallas till ett kontaktark.</p><button class="pri" data-dev autofocus>Framkalla rullen</button><button data-go="roll">Avbryt</button></div></div>`;
 if(v=='dev')return `<div class="dlg" role="status"><div><div class="spin" aria-hidden="true">▤</div><h2>Framkallar dina ögonblick ....</h2></div></div>`;
 if(v=='arch')return `<h2 style="font-size:30px">Arkiv</h2><p>Dina ögonblick, om rullar i taget.</p>${S.arch.length?S.arch.map((a,i)=>`<button class="row" data-sheet="${i}"><span><span class="mono">Roll ${pad(a.n)}</span><br><b>${a.date}</b> · ${a.shots.length} bilder · ${a.style}</span><span aria-hidden="true">›</span></button>`).join(''):'<p class="mono">Inga framkallade rullar ännu.</p>'}`;
 if(v=='sheet'){const a=S.arch[cur];return `${back('arch','Arkiv')}<span class="mono" style="display:block">Roll ${pad(a.n)} · ${a.date}</span><h2 style="font-size:30px;margin-bottom:12px">Kontaktark</h2><div class="sheet">${a.shots.map((s,i)=>`<button data-det="${i}" aria-label="Öppna bild ${i+1}"><img class="${CL[a.style]}" src="${s}" alt="Bild ${i+1} på rulle ${pad(a.n)}"></button>`).join('')}</div>`}
 if(v=='det'){const a=S.arch[cur];return `${back('sheet','Kontaktark')}<span class="mono" style="display:block">Bild ${pic+1} / ${a.shots.length}</span><img class="hero ${CL[a.style]}" src="${a.shots[pic]}" alt="Bild ${pic+1}"><h2 style="font-size:26px;margin-top:14px">Roll ${pad(a.n)}, bild ${pic+1}</h2><p class="mono">${a.date} · ${a.style}</p>`}
 return `<h2 style="font-size:30px">Mer</h2><p>Din kamera. På ditt sätt.</p>
 <div class="row"><span>Filmstil<br><span class="mono">${r.style}</span></span></div>
 <div class="row"><span>Lagring<br><span class="mono">Bilder sparas lokalt i webbläsaren</span></span></div>
 <button data-reset>Rensa all data</button>`;
}
function draw(){A.className=v=='sheet'?'kt':v;const dk=!!({cam:1,confirm:1,dev:1})[v];document.body.classList.toggle('dk',dk);document.getElementById('phone').classList.toggle('dk',dk);A.innerHTML=view()+(['cam','roll','confirm','dev','det'].includes(v)?'':nav());const f=A.querySelector('[autofocus]');if(f)f.focus();if(v=='cam')attach();sync()}
A.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;
 if(d.go){v=d.go}else if('shot' in d){document.getElementById('cam').click();return}
 else if(d.op){if(d.op=='c'){v='roll'}else{cur=S.arch.find(a=>a.n==d.op);v='sheet'}}
 else if(d.yr){yr=d.yr}
 else if(d.pr!==undefined){cur=cur_e();from='roll';pic=+d.pr;v='det'}
 else if(d.ph!==undefined){from='sheet';pic=+d.ph;v='det'}
 else if(d.tg){S.opt[d.tg]=!S.opt[d.tg];save();draw();const q=A.querySelector('[data-tg="'+d.tg+'"]');if(q)q.focus();return}
 else if('fv' in d){S.roll.style=ST[(ST.indexOf(S.roll.style)+1)%3];save()}
 else if('dv' in d){v='dev';draw();const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,pf=document.getElementById('pf');requestAnimationFrame(()=>requestAnimationFrame(()=>{pf.style.width='100%'}));setTimeout(finish,rm?400:2900);return}
 else if(d.pt){if(d.pt=='reset'){S=seed();yr='Alla';cur=null;pm='Prototypen är återställd.'}else if(d.pt=='fill'){S.roll.shots=Array.from({length:36},(_,i)=>i%12);pm='Rullen är fylld med 36 bilder.'}else{S.roll.shots=[];pm='Rullen är tom.'}save();draw();return}
 else if('snap' in d){snap();return}else if('flip' in d){flip();return}else if('cyc' in d){S.roll.style=ST[(ST.indexOf(S.roll.style)+1)%3];save()}else if(d.st){S.roll.style=d.st;save()}
 else if(d.sheet){cur=+d.sheet;v='sheet'}
 else if(d.det){pic=+d.det;v='det'}
 else if('dev' in d){v='dev';const ms=matchMedia('(prefers-reduced-motion:reduce)').matches?300:2800;
  setTimeout(()=>{const r=S.roll;S.arch.unshift({n:r.n,style:r.style,shots:r.shots,date:new Date().toLocaleDateString('sv-SE',{month:'short',year:'numeric'})});S.roll={n:r.n+1,style:r.style,shots:[]};save();cur=0;v='sheet';draw()},ms)}
 else if('reset' in d){if(confirm('Rensa alla rullar?')){localStorage.removeItem('f36');S={roll:{n:1,style:'Warm 400',shots:[]},arch:[]};v='home'}}
 draw();sc();if(v=='cam'&&!stream)startCam();if(v!='cam')stopCam()});
document.getElementById('cam').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f||!left())return;
 const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);S.roll.shots.push(c.toDataURL('image/jpeg',.7));save();draw()};im.src=u});

function Home(){const r=S.roll,n=r.shots.length;return `<div class="hd"><div><div class="logo">FRAME 36.</div><div class="sub">DIGITAL FILM JOURNAL</div></div><button class="ib" data-go="more" aria-label="Om appen">${I(IC.info,30)}</button></div>

<button class="card" data-go="roll" aria-label="Öppna pågående rulle ${pad(r.n)}, ${n} av 36 exponeringar" style="display:block;width:100%;min-height:0;border:0;text-align:left;color:#fff;font:inherit"><div class="pl"><span class="pr">ROLL ${pad(r.n)}</span><span class="pd">${mon()}</span></div>

<button class="pri bi" data-go="cam">${I(IC.cam,20)}Take a photo</button><p class="cap">Du kan framkalla även om du har exponeringar kvar.</p>`}
function Cam(){const r=S.roll;return `<div class="ct"><button class="ci" data-go="home" aria-label="Stäng kameran">${I(IC.x)}</button><button class="pill" data-cyc aria-label="Filmstil: ${r.style}. Byt filmstil">${r.style.toUpperCase()}${I(IC.chev,12)}</button><button class="ci" disabled aria-label="Blixt av">${I(IC.fo)}</button></div>
<div class="vf"><video id="vid" playsinline muted autoplay aria-label="Kamerasökare"></video><div id="nocam" hidden>Kameran är inte tillgänglig här.<br>Använd avtryckaren för att välja ett foto.</div><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><span class="z">1×</span></div>

function Roll(){const r=S.roll,n=r.shots.length;return `<div class="rh"><button class="ci" data-go="home" aria-label="Tillbaka" style="margin-left:-10px">${I(IC.back)}</button><span class="mono">ROLL ${pad(r.n)}</span><h1>Pågående rulle</h1><p class="mono" style="margin:4px 0 0;font-size:10.5px">${mon()} · ${n} AV 36 EXPONERINGAR</p></div>
<div class="rg">${Array.from({length:36},(_,i)=>`<div class="rc"><div class="th ${i<n?'on':''}">${i<n?'<i></i>':''}</div><span>${String(i+1).padStart(2,'0')}<span class="sr"> ${i<n?'tagen':'tom'}</span></span></div>`).join('')}</div>
<button class="out bi" data-go="cam" ${left()?'':'disabled'} style="background:none">${I(IC.cam,20)}Fortsätt foto</button><button class="pri bi" data-go="confirm" style="margin-top:12px" ${n?'':'disabled'}>${I(IC.film,20)}Framkalla rullen</button><p class="cap">Du kan framkalla även om du har exponeringar kvar.</p>`}
function view(){return v=='home'?Home():v=='cam'?Cam():v=='roll'?Roll():oldView()}
let stream=null,facing='environment';
async function startCam(){stopCam();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false})}catch(e){stream=null}attach()}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function attach(){const d=document.getElementById('vid');if(!d)return;if(stream){d.srcObject=stream;d.play&&d.play().catch(()=>{})}else document.getElementById('nocam').hidden=false}
function flip(){facing=facing=='environment'?'user':'environment';startCam()}
function snap(){const d=document.getElementById('vid');if(!left())return;if(stream&&d.videoWidth){const k=Math.min(1,900/Math.max(d.videoWidth,d.videoHeight)),c=document.createElement('canvas');c.width=d.videoWidth*k;c.height=d.videoHeight*k;c.getContext('2d').drawImage(d,0,0,c.width,c.height);S.roll.shots.push(c.toDataURL('image/jpeg',.7));save();draw()}else document.getElementById('cam').click()}

function Roll(){const r=S.roll,n=r.shots.length;return `<div class="rh"><button class="ci" data-go="home" aria-label="Tillbaka" style="margin-left:-10px">${I(IC.back)}</button><span class="mono">ROLL ${pad(r.n)}</span><h1>Pågående rulle</h1><p class="mono" style="margin:4px 0 0;font-size:10.5px">${mon()} · ${n} AV 36 EXPONERINGAR</p></div>
<div class="rg">${Array.from({length:36},(_,i)=>i<n?`<div class="rc"><button class="th on" data-pr="${i}" aria-label="Öppna bild ${i+1}"><img class="${fc(r.style)}" src="${DEMO[r.shots[i]]}" alt=""></button><span>${p2(i+1)}</span></div>`:`<div class="rc"><div class="th"></div><span>${p2(i+1)}<span class="sr"> tom</span></span></div>`).join('')}</div>
<button class="out bi" data-go="cam" ${left()?'':'disabled'} style="background:none">${I(IC.cam,20)}Fortsätt foto</button><button class="pri bi" data-go="confirm" style="margin-top:12px" ${n?'':'disabled'}>${I(IC.film,20)}Framkalla rullen</button><p class="cap">Du kan framkalla även om du har exponeringar kvar.</p>`}
function Confirm(){return `<div class="cf" role="dialog" aria-modal="true" aria-labelledby="t"><button class="ci xb" data-go="roll" aria-label="Stäng">${I(IC.x)}</button><div class="cimg"><div class="mv bc" style="background-image:url(${BGC})"></div></div><h2 id="t">Framkalla rullen?</h2><p>Rullen avslutas och kan inte fotograferas vidare. Dina bilder framkallas till ett kontaktark.</p><div class="cb"><button class="pri bi" data-dv autofocus>${I(IC.film,18)}Framkalla rullen</button><button class="ob" data-go="roll">Avbryt</button></div></div>`}
function Dev(){return `<div class="cf" role="status"><div class="cimg"><div class="mv bd" style="background-image:url(${BGD})"></div></div><div style="color:var(--or)">${I(IC.film,68)}</div><h2>Framkallar dina<br>ögonblick ....</h2><div class="pb"><i id="pf"></i></div></div>`}
function Arch(){const L=list().filter(e=>yr=='Alla'||e.date.endsWith(yr));return `<button class="ci" data-go="home" aria-label="Tillbaka" style="margin-left:-10px">${I(IC.back)}</button><div class="logo2" style="margin-top:0">FRAME 36.</div><h1 class="h1b">Arkiv</h1><p class="sb">Dina ögonblick, en rulle i taget.</p>
<div class="fc" role="group" aria-label="Filtrera på år">${['Alla','2026','2025'].map(y=>`<button data-yr="${y}" aria-pressed="${yr==y}">${y}</button>`).join('')}</div>
<div class="lh"><span>ALLA FILMRULLAR</span><span class="mono">${L.length} rullar</span></div>
${L.map(e=>`<button class="ar" data-op="${e.live?'c':e.n}">${e.shots.length?`<img src="${CV[e.n]&&!e.live?CV[e.n]:DEMO[e.shots[0]]}" alt="">`:'<div class="ph0e"></div>'}<span class="at"><b>ROLL ${pad(e.n)}</b><i>${e.date} · ${e.count} bilder</i><u>${e.style.toUpperCase()}</u></span>${I(IC.r,28)}</button>`).join('')}
<p class="cap" style="margin-top:36px">Små minnen. Hela berättelser.</p>`}
function Sheet(){const e=cur;return `<div class="sh2"><button class="ci" data-go="arch" aria-label="Tillbaka till arkivet" style="margin-left:-10px">${I(IC.back)}</button><span class="mono">ROLL ${pad(e.n)}</span><h1>Kontaktark</h1><span class="mono" style="color:var(--mut)">${e.date} · ${e.count} AV 36 EXPONERINGAR</span></div>
<div class="band"><div class="grid2">${e.shots.map((s,i)=>`<button class="ct2" data-ph="${i}" aria-label="Öppna bild ${i+1}"><img class="${fc(e.style)}" src="${DEMO[s]}" alt=""><span>${p2(i+1)}</span></button>`).join('')}</div></div>`}
function Det(){const e=cur,i=pic,n=e.shots.length;return `<div class="dh"><button class="ci" data-go="${from}" aria-label="Tillbaka">${I(IC.back)}</button><span class="mono">BILD ${p2(i+1)} / ${n}</span><button class="ci" aria-label="Fler alternativ">${I(IC.dots)}</button></div>
<div class="pc"><img class="${fc(e.style)}" src="${i?DEMO[e.shots[i]]:BIG}" alt="${i?'Bild '+(i+1):'Ett stenhus vid havet i kvällsljus'}"></div>
<h2 class="dt">${i?'Bild '+p2(i+1):'Huset vid havet'}</h2><p class="dm">ROLL ${pad(e.n)} · ${e.date}</p>${i?'':'<p class="dd">Ett litet hus vid havet, där vågorna möter klipporna och tiden känns som att den står still. En plats för lugn, stillhet och enkla ögonblick.</p>'}
<div class="dc"><span class="chip">${e.style.toUpperCase()}</span><span><b>${p2(i+1)}</b> av ${n} bilder</span></div>
<nav aria-label="Bildåtgärder"><div style="grid-template-columns:repeat(3,1fr)"><button class="on">${I(IC.pen)}<span>Redigera</span></button><button class="on">${I(IC.share)}<span>Dela</span></button><button>${I(IC.dots)}<span>Mer</span></button></div></nav>`}
const FD={'Warm 400':' · varm och mjuk'};
function More(){const o=S.opt,tg=(k,t,s)=>`<div class="mr"><span><b>${t}</b><i>${s}</i></span><button class="sw" role="switch" aria-checked="${o[k]}" data-tg="${k}" aria-label="${t}"><u></u></button></div>`,ch=(t,s)=>`<button class="mr"><span><b>${t}</b>${s?`<i>${s}</i>`:''}</span>${I(IC.r,26)}</button>`;
return `<div class="logo2">FRAME 36.</div><h1 class="h1b">Mer</h1><p class="sb">Din kamera. På ditt sätt.</p>
<h3 class="sl">FILM &amp; BILDER</h3><div class="gc"><button class="mr" data-fv><span class="tile">36</span><span><b>Filmval</b><i>${S.roll.style}${FD[S.roll.style]||''}</i></span>${I(IC.r,26)}</button>${ch('Exportera bilder','Spara en bild eller ett helt kontaktark')}</div>
<h3 class="sl">INSTÄLLNINGAR</h3><div class="gc">${tg('sound','Kameraljud','Ett litet klick vid varje bild')}${tg('save','Spara i Bilder','Spara automatiskt efter framkallning')}</div>
<h3 class="sl">OM APPEN</h3><div class="gc">${ch('Så fungerar det','')}${ch('Integritet &amp; lagring','')}${ch('Om FRAME 36.','')}</div><h3 class="sl">PROTOTYP · TESTVERKTYG</h3><div class="gc"><button class="mr" data-pt="fill"><span><b>Fyll rullen</b><i>Lägger in 36 exempelbilder i pågående rulle</i></span></button><button class="mr" data-pt="clear"><span><b>Töm rullen</b><i>Startar om pågående rulle med 0 bilder</i></span></button><button class="mr" data-pt="reset"><span><b>Återställ prototypen</b><i>Tillbaka till startläget med Roll 001–004</i></span></button></div><p class="cap" role="status" style="min-height:18px">${pm}</p><p class="cap" style="margin-top:12px">Färre bilder. Fler ögonblick.</p>`}
function view(){return ({home:Home,cam:Cam,roll:Roll,confirm:Confirm,dev:Dev,arch:Arch,sheet:Sheet,det:Det,more:More})[v]()}
function finish(){const r=S.roll,n=Math.max(r.n,...S.arch.map(a=>a.n))+1,e={n:r.n,style:r.style,date:mon(),count:r.shots.length,shots:r.shots};S.arch.push(e);S.roll={n,style:r.style,shots:[]};save();cur=e;from='sheet';v='sheet';draw();sc()}

let pm='';
const seed=()=>({roll:{n:1,style:'Warm 400',shots:R12},arch:[{n:2,style:'Mono 100',date:'OKT 2026',count:36,shots:R12},{n:3,style:'Soft Fade',date:'AUG 2026',count:24,shots:R12},{n:4,style:'Warm 400',date:'DEC 2025',count:36,shots:R12}],opt:{sound:true,save:false}});
const M={home:'hem',cam:'kamera',roll:'rulle',confirm:'bekrafta',arch:'arkiv',sheet:'kontaktark',det:'bild',more:'mer'};
function sync(){if(v=='dev'){history.replaceState(null,'','#rulle');return}const x='#'+M[v];if(location.hash!=x){if(!location.hash)history.replaceState(null,'',x);else location.hash=x}}
addEventListener('hashchange',()=>{const k=Object.keys(M).find(k=>'#'+M[k]==location.hash);if(!k||k==v)return;let nv=k;if((k=='sheet'||k=='det')&&!cur)nv='arch';if(k=='confirm'&&!S.roll.shots.length)nv='roll';v=nv;draw();sc()});
function sc(){window.scrollTo(0,0);const s=document.getElementById('sc');if(s)s.scrollTop=0}
function fit(){const p=document.getElementById('phone');p.style.zoom=innerWidth>=520?Math.min(1,(innerHeight-40)/874):''}
addEventListener('resize',fit);fit();
draw();
</script></body></html>
